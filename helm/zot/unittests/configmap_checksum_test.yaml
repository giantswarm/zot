suite: configmap checksum in deployment
# Can't use global templates in this test suite as it will break the checksum calculation
# causing false negative test outcome.
# templates:
#   - deployment.yaml
tests:
  - it: has no checksum/config if no config
    template: deployment.yaml
    set:
      persistence: false
      # the chart ships a default config.json, so turn the mount off instead
      mountConfig: false
    asserts:
      - isNull:
          path: spec.template.metadata.annotations.checksum/config
  - it: generate checksum/config if config is present
    template: deployment.yaml
    set:
      # deployment.yaml renders only when persistence is off; the default is on.
      persistence: false
      mountConfig: true
      configFiles:
        config.json: "{}"
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations.checksum/config
      - matchRegex:
          path: spec.template.metadata.annotations.checksum/config
          pattern: "^[a-f0-9]{64}$" # SHA256 hex output
